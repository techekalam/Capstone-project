<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="./register.css">

</head>
<body>
     <div class="container forgot-container">
        <div class="title" style="color:white;">Forgot Password</div>
        <p>Enter your email address and we will send a link to reset your password</p>
<form class="form" action="#" method="post" autocomplete="on" id="forgotPasswordForm">
            <div class="user-details">
                <div class="input-box">
                    <span class="details">Email Address</span>
                    <input type="email" name="email" placeholder="Enter your email" id="email" required>
                </div>
                <div class="button">
                    <button type="submit">Send Reset Link</button>
                </div>
           </div>
        </form>
        <p id="message" style="color:white; text-align:center; margin-top:10px;"></p>
       <a href="./login.html" class="back-login">Back to login</a>
    </div>
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../admin-dashboard/supabase.js"></script>
    <script>
        const sb = window.supabaseClient;

        const forgotForm = document.getElementById('forgotPasswordForm');
        if (forgotForm) {
            forgotForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const message = document.getElementById('message');

                if (!sb) {
                    if (message) {
                        message.style.color = "red";
                        message.textContent = "Database connection failed. Please refresh.";
                    }
                    return;
                }

                // Validate email domain
                if (!email.toLowerCase().endsWith('@cavendish.ac.ug')) {
                    if (message) {
                        message.style.color = "red";
                        message.textContent = "Access denied: Only @cavendish.ac.ug emails are allowed.";
                    }
                    return;
                }

                if (message) {
                    message.style.color = "white";
                    message.textContent = "Sending reset link...";
                }

                const redirectUrl = new URL('../user-dashboard/change password.html', window.location.href).href;

                const { error } = await sb.auth.resetPasswordForEmail(email, {
                    redirectTo: redirectUrl
                });

                if (error) {
                    if (message) {
                        message.style.color = "red";
                        message.textContent = error.message;
                    }
                } else {
                    if (message) {
                        message.style.color = "#22c55e";
                        message.textContent = "Password reset link sent! Check your email.";
                    }
                }
            });
        }
    </script>
</body>
</html>
