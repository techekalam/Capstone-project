<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login-page</title>
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap">
</head>
<body>
    <div class="container">
        <p style="text-align:center;color:white;"><strong>CUU LOST & FOUND SYSTEM</strong></p>
        <div class="title" style="color:white;">REGISTRATION</div>
        <form id="signupForm" action="#">
            <div class="user-details">
                <div class="input-box">
                    <span class="details">Full Name</span>
                    <input type="text" id="fullName" placeholder="Enter your name" required>
                </div>
                <div class="input-box">
                    <span class="details">Email</span>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="input-box">
                    <span class="details">Phone Number</span>
                    <input type="tel" id="phone" placeholder="Enter your phone number" required>
                </div>
                <div class="input-box">
                    <span class="details">Password</span>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <img src="../login-page/images/eye-close.png" alt="Toggle password visibility" id="eyeicon">
                    </div>
                    </div>
                <div class="input-box">
                    <span class="details">Confirm Password</span>
                    <div class="password-wrapper">
                        <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                        <img src="../login-page/images/eye-close.png" alt="Toggle password visibility" id="eyeicon-confirm">
                    </div>
            </div>
            </div>
            <div class="button">
                <input type="submit" value="Register">
            </div>
            <p id="message" style="color:white; text-align:center; margin-top:10px;"></p>
        </form>
    </div>
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../admin-dashboard/supabase.js"></script>
        <script src="../user-dashboard/css/js/script.js"></script>
    <script>
        let eyeicon = document.getElementById("eyeicon");
        let password = document.getElementById("password");
        eyeicon.onclick = function(){
            if(password.type == "password"){
                password.type = "text";
            }else{
                password.type = "password";
            }
        }

        let eyeiconConfirm = document.getElementById("eyeicon-confirm");
        let confirmPassword = document.getElementById("confirm-password");
        eyeiconConfirm.onclick = function(){
            if(confirmPassword.type == "password"){
                confirmPassword.type = "text";
            }else{
                confirmPassword.type = "password";
            }
        }
    </script>
</body>
</html>
