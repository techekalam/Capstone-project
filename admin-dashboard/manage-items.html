<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Items</title>

    <link rel="stylesheet" href="manage-items.css">
</head>
<body>
<div class="manage-items-container">
    <div style="margin-bottom: 15px;">
        <a id="back-to-dashboard-btn" href="admin-dashboard.html" style="color: #38bdf8; text-decoration: none; font-weight: bold;">&larr; Back to Dashboard</a>
    </div>
    <div class="manage-header">

        <div>
            <h1 style="color:white;">Manage Lost & Found Items</h1>

            <p style="color:white;">
                Manage all lost and found items reported around campus.
            </p>
        </div>
        <button class="primary-btn" id="add-item-btn">
            + Add Item
        </button>

    </div>
    <div class="manage-controls">
        <input 
        type="text"
        id="search-item"
        placeholder="🔍 Search item by name, category, or location..."
        style="flex: 1;"
        >
        <select id="filter-item">

            <option value="all">
                All Statuses
            </option>

            <option value="Lost">
                Lost
            </option>

            <option value="Found">
                Found
            </option>

            <option value="Claimed">
                Claimed
            </option>

            <option value="Pending">
                Pending
            </option>

        </select>

    </div>
    <div class="items-grid" id="items-grid">
        <p style="color: white; grid-column: span 2; text-align: center;">Loading items...</p>
    </div>


</div>

<!-- Add Item Modal -->
<div id="add-item-modal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center;">
    <div class="modal-content" style="background: #0f172a; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 25px; border-radius: 16px; width: 90%; max-width: 480px; position: relative;">
        <span class="close" style="position: absolute; top: 15px; right: 20px; color: white; font-size: 24px; cursor: pointer;">&times;</span>
        <h2 style="margin-top: 0; color: white;">Add New Item</h2>
        <form id="add-item-form" style="display: flex; flex-direction: column; gap: 12px;">
            <div>
                <label style="display: block; margin-bottom: 4px; font-size: 0.9rem;">Item Name</label>
                <input type="text" id="new-name" placeholder="e.g. Dell Laptop" required style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; box-sizing: border-box;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 4px; font-size: 0.9rem;">Item Type</label>
                <select id="new-type" required style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; box-sizing: border-box;">
                    <option value="Found Item">Found Item</option>
                    <option value="Lost Item">Lost Item</option>
                </select>
            </div>
            <div>
                <label style="display: block; margin-bottom: 4px; font-size: 0.9rem;">Category</label>
                <input type="text" id="new-category" placeholder="e.g. Electronics, Keys, Books" required style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; box-sizing: border-box;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 4px; font-size: 0.9rem;">Location</label>
                <input type="text" id="new-location" placeholder="e.g. Library 2nd Floor" required style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; box-sizing: border-box;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 4px; font-size: 0.9rem;">Description</label>
                <textarea id="new-description" rows="3" placeholder="Additional details..." style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; box-sizing: border-box;"></textarea>
            </div>
            <div>
                <label style="display: block; margin-bottom: 4px; font-size: 0.9rem;">Item Image (Optional)</label>
                <input type="file" id="new-image" accept="image/*" style="color: white;">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px; justify-content: flex-end;">
                <button type="button" class="close" style="padding: 8px 16px; border-radius: 6px; border: none; background: #475569; color: white; cursor: pointer;">Cancel</button>
                <button type="submit" id="save-item" style="padding: 8px 16px; border-radius: 6px; border: none; background: #2563eb; color: white; font-weight: bold; cursor: pointer;">Save Item</button>
            </div>
        </form>
    </div>
</div>

<!-- View Item Modal -->
<div id="view-item-modal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center;">

    <div class="modal-content" style="background: #0f172a; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 25px; border-radius: 16px; width: 90%; max-width: 480px; position: relative;">
        <span class="close-view" style="position: absolute; top: 15px; right: 20px; color: white; font-size: 24px; cursor: pointer;">&times;</span>
        <img id="view-image" style="max-width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; display: block;">
        <h2 id="view-name" style="margin-top: 0; color: #38bdf8;"></h2>
        <p id="view-category"></p>
        <p id="view-location"></p>
        <p id="view-status"></p>
        <p id="view-description" style="color: #cbd5e1; font-style: italic;"></p>
    </div>
</div>

<div id="image-modal" class="image-modal">

    <span id="close-image">&times;</span>

    <img id="full-image">

</div>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="./supabase.js"></script>
    <script src="./manage-items.js"></script>
</body>
</html>
