<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim Item - CUU Lost & Found</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .item-preview-banner {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: white;
    }
    .item-preview-banner img {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 6px;
      background: #334155;
    }
    .item-preview-info h4 {
      margin: 0 0 4px 0;
      color: #38bdf8;
      font-size: 1.1rem;
    }
    .item-preview-info p {
      margin: 0;
      font-size: 0.875rem;
      color: #cbd5e1;
    }
    .form-label {
      display: block;
      color: white;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 4px;
      text-align: left;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <img src="images/logo.jpg" alt="CUU Logo" style="height:40px;width:40px;border-radius:50%;">
      <div class="nav-links">
        <a href="user recent activity.html">Recent Activity</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="report.html">Report Item</a>
        <a href="items.html">Browse Items</a>
        <a href="my-report.html">My Reports</a>
        <a href="../homepage/index.html">Home</a>
        <a href="profile.html">Profile</a>
      </div>
      <a href="../login-page/login.html"><button id="logoutBtn">Log Out</button></a>
    </div>
  </nav>

  <div class="dashboard-container">
    <h2 style="color:white; margin-top:0;">Claim an Item</h2>
    <p style="color:#cbd5e1; font-size:0.95rem; margin-bottom:20px;">
      Please provide details to help verify that this item belongs to you.
    </p>

    <!-- Item Preview Banner (populated if item_id query parameter is present) -->
    <div id="itemPreviewCard" class="item-preview-banner" style="display: none;">
      <img id="previewImage" src="placeholder.png" alt="Item Image">
      <div class="item-preview-info">
        <h4 id="previewName">Item Name</h4>
        <p id="previewMeta">Location — Date</p>
      </div>
    </div>

    <form id="claimForm">
      <input type="hidden" id="itemId" name="itemId" value="">

      <label class="form-label" for="itemName">Item Being Claimed</label>
      <input type="text" id="itemName" name="itemName" placeholder="e.g. Black Dell Laptop"required>

      <label class="form-label" for="claimReason">Why are you claiming this item?</label>
      <textarea id="claimReason" name="claimReason" rows="3" placeholder="Explain why you believe this item belongs to you..." style="color:rgb(8, 8, 8)" required></textarea>

      <label class="form-label" for="itemDescription">Describe the item in detail</label>
      <textarea id="itemDescription" name="itemDescription" rows="3" placeholder="Mention unique features, colour, brand, marks, scratches, etc." style="color:rgb(7, 7, 7);" required></textarea>

      <label class="form-label" for="proofDetails">Proof of Ownership</label>
      <textarea id="proofDetails" name="proofDetails" rows="3" placeholder="Provide receipt details, serial numbers, password patterns, or distinguishing marks..." style="color:white;" required></textarea>

      <label class="form-label" for="contactPhone">Contact Phone Number</label>
      <input type="tel" id="contactPhone" name="contactPhone" placeholder="e.g. +256 700 000 000" style="color:rgb(0, 0, 0);" required>

      <button type="submit" id="submitClaimBtn">Submit Claim Request</button>
    </form>

    <p id="message" style="margin-top:15px; font-weight:bold;"></p>
  </div>

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Supabase connection setup -->
  <script src="../admin-dashboard/supabase.js"></script>
  <!-- Claim Logic JS -->
  <script src="claim.js"></script>
</body>
</html>
