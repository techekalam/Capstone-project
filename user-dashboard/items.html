<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Items - CUU Lost &amp; Found</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <img src="images/logo.jpg" alt="CUU Logo" style="height:40px;width:40px;border-radius:50%;">
      <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="nav-links">
        <a href="dashboard.html">Dashboard</a>
          <a href="user recent activity.html">Recent Activity</a>
        <a href="report.html">Report Item</a>
        <a href="items.html">Browse Items</a>
        <a href="my-report.html">My Reports</a>
        <a href="../homepage/index.html">Home</a>
        <a href="profile.html">Profile</a>
        <button id="logoutBtn" type="button">Log Out</button>
      </div>
    </div>
  </nav>

  <div class="dashboard-container">
    <h2 style="color:white; margin-top:0;">Browse CUU Lost & Found Items</h2>
    <input type="text" id="searchInput" placeholder="🔍 Search by item name, category, or location..." style="width:100%; padding:12px 16px; margin:14px 0 20px 0; border-radius:8px; border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.9); font-size:0.95rem; color:#0f172a; outline:none;">
    <div id="itemsList" class="reports-list">
      <p id="noItems" style="color:white;">Loading items…</p>
    </div>
  </div>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../admin-dashboard/supabase.js"></script>
  <script src="css/js/script.js"></script>
  <script>
    const hb = document.getElementById('hamburger');
    const nl = document.getElementById('nav-links');
    if (hb && nl) hb.addEventListener('click', () => nl.classList.toggle('open'));
  </script>
</body>
</html>
