<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Items - CUU Lost &amp; Found</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <div class="nav-brand" style="display:flex;align-items:center;gap:10px;">
        <img src="images/logo.jpg" alt="CUU Logo" style="height:40px;width:40px;border-radius:50%;">
        <span style="color:white;font-weight:700;font-size:0.9rem;">CUU LOST &amp; FOUND SYSTEM</span>
      </div>
      <div class="nav-links" id="nav-links">
        <a href="dashboard.html" class="nav-btn">Dashboard</a>
        <a href="user recent activity.html" class="nav-btn">Recent Activity</a>
        <a href="report.html" class="nav-btn">Report Item</a>
        <a href="items.html" class="nav-btn active">Browse Items</a>
        <a href="my-report.html" class="nav-btn">My Reports</a>
        <a href="profile.html" class="nav-btn">Profile</a>
        <button id="logoutBtn" class="nav-btn logout-btn" type="button">Log Out</button>
      </div>
    </div>
  </nav>

  <div class="dashboard-container">
    <h2 style="color:white; margin-top:0;">Browse CUU Lost & Found Items</h2>
    <input type="text" id="searchInput" placeholder="🔍 Search by item name, category, or location..." style="width:100%; padding:12px 16px; margin:14px 0 20px 0; border-radius:8px; border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.9); font-size:0.95rem; color:#0f172a; outline:none;">
    <div id="itemsList" class="reports-list">
      <p id="noItems" style="color:white;">Loading items…</p>
    </div>
  </div>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../admin-dashboard/supabase.js"></script>
  <script src="css/js/script.js"></script>
</body>
</html>
