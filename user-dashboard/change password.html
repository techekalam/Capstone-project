<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="./profile.css">
    <link rel="stylesheet" href="../login-page/register.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        /* Override profile.css eyeicon positioning - use register.css style instead */
        .password-wrapper img {
            position: absolute !important;
            right: 12px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            width: 22px !important;
            height: 22px !important;
            cursor: pointer !important;
            opacity: 0.7 !important;
            border: none !important;
        }
        .password-wrapper img:hover {
            opacity: 1 !important;
        }
        /* Center the title properly */
        .container .title {
            text-align: center;
            margin-top: 4px;
            margin-bottom: 12px;
        }
/* Ensure button text is centered */
        .button button {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            padding: 0 !important;
            font-size: 17px !important;
            font-weight: 600 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title" style="color:white;">Change Password</div>
        <form id="changePasswordForm">
            <div class="user-details">
                <div class="input-box">
                    <span class="details">Current Password</span>
                    <div class="password-wrapper">
                        <input type="password" placeholder="Current password" id="currentPassword" class="password-input" required>
                        <img src="../login-page/images/eye-close.png" class="eyeicon" alt="toggle password">
                    </div>
                </div>
                <div class="input-box">
                    <span class="details">New Password</span>
                    <div class="password-wrapper">
                        <input type="password" placeholder="New password" id="newPassword" class="password-input" required>
                        <img src="../login-page/images/eye-close.png" class="eyeicon" alt="toggle password">
                    </div>
                </div>
                <div class="input-box">
                    <span class="details">Confirm New Password</span>
                    <div class="password-wrapper">
                        <input type="password" placeholder="Enter your new password" id="confirmNewPassword" class="password-input" required>
                        <img src="../login-page/images/eye-close.png" class="eyeicon" alt="toggle password">
                    </div>
                </div>
            </div>
            <div class="button">
                <button type="submit">Change Password</button>
            </div>
            <p id="message" style="color:white; text-align:center; margin-top:10px;"></p>
            <div class="links" style="text-align:center;margin-top:8px;">
                <a href="profile.html" style="color:white;text-decoration:none;">Cancel</a>
            </div>
        </form>
    </div>
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../admin-dashboard/supabase.js"></script>
    <script>
        document.querySelectorAll('.eyeicon').forEach((icon) => {
            icon.addEventListener('click', () => {
                const wrapper = icon.closest('.password-wrapper');
                const input = wrapper ? wrapper.querySelector('.password-input') : null;
                if (!input) return;

                if (input.type === 'password') {
                    input.type = 'text';
                } else {
                    input.type = 'password';
                }
            });
        });
    </script>
    <script>
        const sb = window.supabaseClient;

        // Detect if the user arrived here via a password-recovery link from email.
        let isRecoveryMode = false;

        async function detectRecoveryMode() {
            if (!sb) return;
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                isRecoveryMode = !!session.currentSession?.recovery || !!session.recovery;
            }
            if (isRecoveryMode) {
                const currentField = document.getElementById('currentPassword');
                if (currentField) {
                    currentField.removeAttribute('required');
                    const currentBox = currentField.closest('.input-box');
                    if (currentBox) currentBox.style.display = 'none';
                }
            }
        }
        detectRecoveryMode();

        const changePasswordForm = document.getElementById('changePasswordForm');
        if (changePasswordForm) {
            changePasswordForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const message = document.getElementById('message');

                const currentPassword = document.getElementById('currentPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmNewPassword = document.getElementById('confirmNewPassword').value;

                if (!sb) {
                    if (message) {
                        message.style.color = "red";
                        message.textContent = "Database connection unavailable. Please refresh.";
                    }
                    return;
                }

                if (newPassword !== confirmNewPassword) {
                    if (message) {
                        message.style.color = "red";
                        message.textContent = "New passwords do not match!";
                    }
                    return;
                }

                if (newPassword.length < 6) {
                    if (message) {
                        message.style.color = "red";
                        message.textContent = "New password must be at least 6 characters long.";
                    }
                    return;
                }

                if (message) {
                    message.style.color = "white";
                    message.textContent = "Updating password...";
                }

                const { data: { user }, error: userErr } = await sb.auth.getUser();
                if (!user || userErr) {
                    window.location.href = '../login-page/login.html';
                    return;
                }

                // If not in recovery mode, verify current password first
                if (!isRecoveryMode && currentPassword) {
                    const { error: verifyErr } = await sb.auth.signInWithPassword({
                        email: user.email,
                        password: currentPassword
                    });

                    if (verifyErr) {
                        if (message) {
                            message.style.color = "red";
                            message.textContent = "Current password is incorrect.";
                        }
                        return;
                    }
                }

                // Update to the new password
                const { error } = await sb.auth.updateUser({ password: newPassword });

                if (error) {
                    if (message) {
                        message.style.color = "red";
                        message.textContent = error.message;
                    }
                } else {
                    if (message) {
                        message.style.color = "#22c55e";
                        message.textContent = isRecoveryMode 
                            ? "Password reset successfully! Redirecting to login..." 
                            : "Password changed successfully! Redirecting...";
                    }
                    setTimeout(() => {
                        window.location.href = isRecoveryMode ? '../login-page/login.html' : 'profile.html';
                    }, 1500);
                }
            });
        }
    </script>
</body>
</html>
