<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="./profile.css">
    <link rel="stylesheet" href="../login-page/register.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        /* Center the title properly */
        .container .title {
            text-align: center;
            margin-top: 4px;
            margin-bottom: 12px;
        }
        /* Ensure button text is centered */
        .button button {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            padding: 0 !important;
            font-size: 17px !important;
            font-weight: 600 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title" style="color:white;">Edit Profile</div>
        <form id="editProfileForm">
            <div class="user-details">
                <div class="input-box">
                    <span class="details">Profile Picture</span>
                    <img id="avatarPreview" src="../login-page/images/logo.jpg" alt="Avatar preview" style="width:90px;height:90px;border-radius:50%;object-fit:cover;margin-bottom:8px;display:block;">
                    <input type="file" id="avatarFile" accept="image/*">
                </div>
                <div class="input-box">
                    <span class="details">Full Name</span>
                    <input type="text" id="fullName" placeholder="Enter your name" required>
                </div>
                <div class="input-box">
                    <span class="details">Phone Number</span>
                    <input type="tel" id="phone" placeholder="Enter your phone number">
                </div>
            </div>
            <div class="button">
                <button type="submit">Save</button>
            </div>
            <p id="message" style="color:white; text-align:center; margin-top:10px;"></p>
            <div class="links" style="text-align:center;margin-top:8px;">
                <a href="profile.html" style="color:white;text-decoration:none;">Cancel</a>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../admin-dashboard/supabase.js"></script>
    <script>
        const sb = window.supabaseClient;

        // Pre-fill form with existing profile/auth data
        async function loadProfileIntoForm() {
            if (!sb) {
                console.error('[EDIT] Supabase client is NULL');
                return;
            }

            // Use getUser() to get fresh user data from the server (not stale cache)
            const { data: { user }, error: userErr } = await sb.auth.getUser();
            if (!user || userErr) {
                console.error('[EDIT] No user or auth error:', userErr);
                window.location.href = '../login-page/login.html';
                return;
            }

            const userId = user.id;
            console.log('[EDIT] Loading profile for user:', userId);

            // Fetch from Profiles table
            const { data: profile, error: profileErr } = await sb
                .from('Profiles')
                .select('*')
                .eq('id', userId)
                .maybeSingle();

            console.log('[EDIT] Loaded profile row:', profile, 'Error:', profileErr);

            const fullNameEl = document.getElementById('fullName');
            const phoneEl = document.getElementById('phone');
            const avatarPreview = document.getElementById('avatarPreview');

            // Prefer Profiles table data, fall back to auth metadata
            const currentName = (profile && profile.full_name) || user.user_metadata?.full_name || '';
            const currentPhone = (profile && profile.phone) || user.user_metadata?.phone || '';
            const currentAvatar = (profile && profile.avatar_url) || user.user_metadata?.avatar_url || '';

            if (fullNameEl) fullNameEl.value = currentName;
            if (phoneEl) phoneEl.value = currentPhone;
            if (avatarPreview && currentAvatar) {
                avatarPreview.src = currentAvatar;
            }
        }
        loadProfileIntoForm();

        // Live preview for avatar file selection
        const avatarFileInput = document.getElementById('avatarFile');
        if (avatarFileInput) {
            avatarFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const avatarPreview = document.getElementById('avatarPreview');
                    if (avatarPreview) {
                        avatarPreview.src = URL.createObjectURL(file);
                    }
                }
            });
        }

        // Form Submit Handler
        const editForm = document.getElementById('editProfileForm');
        if (editForm) {
            editForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const message = document.getElementById('message');
                if (!sb) {
                    if (message) {
                        message.style.color = "#ef4444";
                        message.textContent = "Database connection unavailable. Please refresh.";
                    }
                    return;
                }

                // Use getUser() for fresh, server-verified user data
                const { data: { user }, error: userErr } = await sb.auth.getUser();
                if (!user || userErr) {
                    window.location.href = '../login-page/login.html';
                    return;
                }

                const userId = user.id;
                const userEmail = user.email;
                const fullNameEl = document.getElementById('fullName');
                const phoneEl = document.getElementById('phone');

                const fullName = fullNameEl ? fullNameEl.value.trim() : '';
                const phone = phoneEl ? phoneEl.value.trim() : '';

                console.log('[EDIT] Saving profile — userId:', userId, 'name:', fullName, 'phone:', phone);

                if (!fullName) {
                    if (message) {
                        message.style.color = "#ef4444";
                        message.textContent = "Please enter your full name.";
                    }
                    return;
                }

                if (message) {
                    message.style.color = "#ffffff";
                    message.textContent = "Saving changes...";
                }

                // Upload Avatar if selected
                let avatarUrl = null;
                const avatarFile = avatarFileInput && avatarFileInput.files ? avatarFileInput.files[0] : null;
                if (avatarFile) {
                    try {
                        if (typeof uploadItemImage === 'function') {
                            avatarUrl = await uploadItemImage(avatarFile, userId);
                        } else {
                            const filePath = `${userId}/avatar_${Date.now()}_${avatarFile.name}`;
                            const { error: uploadError } = await sb.storage
                                .from('item-images')
                                .upload(filePath, avatarFile);
                            if (!uploadError) {
                                const { data: publicUrlData } = sb.storage
                                    .from('item-images')
                                    .getPublicUrl(filePath);
                                avatarUrl = publicUrlData.publicUrl;
                            }
                        }
                    } catch (avatarErr) {
                        console.warn('[EDIT] Avatar upload warning:', avatarErr);
                    }
                }

                // ── Step 1: Save to Profiles table ──
                let dbSaveError = null;

                const updateFields = {
                    full_name: fullName,
                    phone: phone,
                    email: userEmail,
                    ...(avatarUrl ? { avatar_url: avatarUrl } : {})
                };

                // First, check if the profile row exists
                const { data: existingProfile, error: checkErr } = await sb
                    .from('Profiles')
                    .select('id')
                    .eq('id', userId)
                    .maybeSingle();

                console.log('[EDIT] Existing profile check:', existingProfile, 'Error:', checkErr);

                if (existingProfile) {
                    // Row exists → UPDATE it
                    const { data: updateData, error: updateErr } = await sb
                        .from('Profiles')
                        .update(updateFields)
                        .eq('id', userId)
                        .select();

                    console.log('[EDIT] UPDATE result — data:', updateData, 'error:', updateErr);

                    if (updateErr) {
                        dbSaveError = updateErr;
                        console.error('[EDIT] UPDATE failed:', updateErr.message, updateErr.details, updateErr.hint);
                    } else if (!updateData || updateData.length === 0) {
                        // Update returned 0 rows — likely RLS blocking the write
                        console.error('[EDIT] UPDATE returned 0 rows — RLS may be blocking the update');
                        dbSaveError = { message: 'Update returned 0 rows. Check Supabase RLS policies for the Profiles table.' };
                    }
                } else {
                    // No row exists → INSERT
                    const { data: insertData, error: insertErr } = await sb
                        .from('Profiles')
                        .insert({
                            id: userId,
                            ...updateFields,
                            role: 'student'
                        })
                        .select();

                    console.log('[EDIT] INSERT result — data:', insertData, 'error:', insertErr);

                    if (insertErr) {
                        dbSaveError = insertErr;
                        console.error('[EDIT] INSERT failed:', insertErr.message, insertErr.details, insertErr.hint);
                    }
                }

                // ── Step 2: Sync Supabase Auth user_metadata ──
                let authSaveError = null;
                try {
                    const { error: authErr } = await sb.auth.updateUser({
                        data: {
                            full_name: fullName,
                            phone: phone,
                            ...(avatarUrl ? { avatar_url: avatarUrl } : {})
                        }
                    });
                    if (authErr) {
                        authSaveError = authErr;
                        console.error('[EDIT] Auth updateUser failed:', authErr.message);
                    } else {
                        console.log('[EDIT] Auth updateUser succeeded');
                    }
                } catch (err) {
                    authSaveError = err;
                    console.error('[EDIT] Auth updateUser exception:', err);
                }

                // ── Step 3: Report result ──
                if (dbSaveError || authSaveError) {
                    const errObj = dbSaveError || authSaveError;
                    console.error('[EDIT] FINAL — dbError:', dbSaveError, 'authError:', authSaveError);
                    if (message) {
                        message.style.color = "#ef4444";
                        message.textContent = "Save failed: " + (errObj.message || "Database or Auth error");
                    }
                } else {
                    console.log('[EDIT] FINAL — Profile saved successfully');
                    if (message) {
                        message.style.color = "#22c55e";
                        message.textContent = "Profile saved successfully! Redirecting...";
                    }

                    // Force refresh the local session cache so profile.html sees updated data
                    try {
                        await sb.auth.refreshSession();
                    } catch (refreshErr) {
                        console.warn('[EDIT] Session refresh warning:', refreshErr);
                    }

                    setTimeout(() => {
                        window.location.replace('profile.html?updated=' + Date.now());
                    }, 600);
                }
            });
        }
    </script>
</body>
</html>
